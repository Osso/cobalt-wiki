[package]
edition = "2024"
name = "ftml"
version = "1.41.0"
authors = ["Emmie Smith <emmie.maeda@gmail.com>"]
build = "build.rs"
exclude = [
    ".gitignore",
    ".editorconfig",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Foundation Text Markup Language - a library to render Wikidot text as HTML"
readme = "README.md"
keywords = [
    "wikidot",
    "wikijump",
    "ftml",
    "parsing",
    "html",
]
categories = ["parser-implementations"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/scpwiki/ftml"

[features]
default = [
    "html",
    "mathml",
]
html = ["lightningcss"]
mathml = [
    "html",
    "latex2mathml",
]

[lib]
name = "ftml"
crate-type = [
    "cdylib",
    "lib",
]
path = "src/lib.rs"

[[example]]
name = "dump_json"
path = "examples/dump_json.rs"

[[example]]
name = "validate_json"
path = "examples/validate_json.rs"

[dependencies.cfg-if]
version = "1"

[dependencies.entities]
version = "1"

[dependencies.enum-map]
version = "2"

[dependencies.icu_calendar]
version = "2.1"

[dependencies.icu_datetime]
