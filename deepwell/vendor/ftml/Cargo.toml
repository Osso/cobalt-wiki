[dependencies.serde-wasm-bindgen]
version = "0.6"

[dependencies.serde_json]
version = "1"

[dependencies.serde_repr]
version = "0.1"

[dependencies.str-macro]
version = "1"

[dependencies.strum]
version = "0.28"

[dependencies.strum_macros]
