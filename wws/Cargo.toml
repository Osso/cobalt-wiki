[package]
name = "wws"
description = "Wilson's Web Server - Serves a zoo of user-generated content"
repository = "https://github.com/scpwiki/wikijump/tree/develop/wws"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = ["wikijump", "api", "backend", "wiki"]
categories = ["asynchronous", "caching", "web-programming::http-server"]
exclude = [".gitignore"]

version = "2026.8.20"
authors = ["Emmie Smith <emmie.maeda@gmail.com>"]
edition = "2024"

[dependencies]
accept-language = "3"
anyhow = "1"
axum = { version = "0.8", features = ["http1", "http2", "macros", "tokio", "tower-log", "tracing"], default-features = false }
axum-extra = { version = "0.12", features = ["typed-header"] }
clap = "4"
color-backtrace = "0.7"
dotenvy = "0.15"
headers = "0.4"
jsonrpsee = { version = "0.26", features = ["async-client", "jsonrpsee-http-client"] }
paste = "1"
rand = "0.10"
redis = { version = "1", features = ["aio", "connection-manager", "tokio-comp", "tokio-rustls-comp"], default-features = false }
ref-map = "0.2"
rust-s3 = { version = "0.37", features = ["with-tokio", "tokio-rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
str-macro = "1"
thiserror = "2"
time = "0.3"  # presigned URL signing time
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.0", features = ["add-extension", "compression-br", "compression-deflate", "compression-gzip", "compression-zstd", "normalize-path", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wikidot-normalize = "0.12"

[dev-dependencies]
serde_json = "1"  # fake DEEPWELL JSON-RPC server in handler tests
tower = { version = "0.5", features = ["util"] }  # drive the router in handler tests

[build-dependencies]
built = { version = "0.8", features = ["git2"] }

# Lints

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
result_large_err = "allow"  # ResponseResult is large because it has axum Response in it

[package.metadata.cargo-machete]
ignored = ["rust-s3"]  # renamed to s3

# Wikidot keeps later colons in page names (writing:a:b); upstream merges them.
# Shares Deepwell's patched copy, see deepwell/vendor/README.md.
[patch.crates-io]
wikidot-normalize = { path = "../deepwell/vendor/wikidot-normalize" }
